name: folio
description: "Folio — a fast, offline document reader for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  lucide_flutter: ^1.42.0
  markdown: 7.3.1
  path_provider: 2.1.6
  pdfrx: 2.6.1
  scroll_to_index: 3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
